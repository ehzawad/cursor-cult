name: temporary agent-mode PR patch bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/agent-mode-background-warning'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract and apply the guarded patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/agent-mode-warning-autofix.yml').read_text(encoding='utf-8')
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          patch = textwrap.dedent(workflow[start:end]) + "\n"
          Path('/tmp/apply_agent_mode_patch.py').write_text(patch, encoding='utf-8')
          PY
          python3 /tmp/apply_agent_mode_patch.py
          ./scripts/sync_packages.sh
      - name: Verify patch
        run: |
          python3 -m py_compile scripts/cursor_cult.py tests/test_cursor_cult.py
          python3 -m unittest discover -s tests -v
          bash -n bin/cursor-cult scripts/*.sh tests/fake_cursor_agent.sh
          ./scripts/sync_packages.sh --check
      - name: Commit final patch and remove temporary bootstrap files
        shell: bash
        run: |
          rm .github/workflows/agent-mode-warning-autofix.yml
          rm .github/workflows/agent-mode-warning-pr-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Warn before agent-mode fleet execution"
          git push origin HEAD:${{ github.head_ref }}
