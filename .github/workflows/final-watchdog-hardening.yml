name: temporary final watchdog hardening

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/agent-mode-background-warning'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply transparent guarded patches
        run: |
          python3 scripts/final_harden_runner.py
          python3 scripts/final_harden_docs.py
          python3 scripts/final_harden_tests_version.py
          ./scripts/sync_packages.sh
      - name: Verify final branch
        run: |
          python3 -m py_compile scripts/cursor_cult.py tests/test_cursor_cult.py
          python3 -m unittest discover -s tests -v
          bash -n bin/cursor-cult scripts/*.sh tests/fake_cursor_agent.sh
          ./scripts/sync_packages.sh --check
          python3 -m json.tool monitors/monitors.json >/dev/null
          python3 -m json.tool plugins/cursor-cult/monitors/monitors.json >/dev/null
          python3 -m json.tool .claude-plugin/plugin.json >/dev/null
          python3 -m json.tool .claude-plugin/marketplace.json >/dev/null
          python3 -m json.tool .codex-plugin/plugin.json >/dev/null
          python3 -m json.tool .agents/plugins/marketplace.json >/dev/null
      - name: Commit hardened branch and remove temporary patch files
        run: |
          rm .github/workflows/final-watchdog-hardening.yml
          rm scripts/final_harden_runner.py
          rm scripts/final_harden_docs.py
          rm scripts/final_harden_tests_version.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden watchdog recovery and host session binding"
          git push origin HEAD:${{ github.head_ref }}
