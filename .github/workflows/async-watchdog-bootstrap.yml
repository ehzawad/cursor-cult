name: temporary async watchdog patch bootstrap

on:
  push:
    branches:
      - agent/agent-mode-background-warning

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/agent-mode-background-warning
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply async watchdog patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/apply_async_watchdog_patch.py
          python3 /tmp/apply_async_watchdog_patch.py
          ./scripts/sync_packages.sh
      - name: Verify patch
        shell: bash
        run: |
          python3 -m py_compile scripts/cursor_cult.py tests/test_cursor_cult.py
          python3 -m unittest discover -s tests -v
          bash -n bin/cursor-cult scripts/*.sh tests/fake_cursor_agent.sh
          ./scripts/sync_packages.sh --check
          python3 -m json.tool monitors/monitors.json >/dev/null
          python3 -m json.tool plugins/cursor-cult/monitors/monitors.json >/dev/null
      - name: Commit final patch and remove bootstrap
        shell: bash
        run: |
          rm .github/workflows/async-watchdog-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add async watchdog event protocol"
          git push origin HEAD:agent/agent-mode-background-warning
