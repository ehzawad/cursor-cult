name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python3 -m py_compile scripts/cursor_cult.py scripts/cursor_delegate.py tests/*.py
      - name: Tests
        run: python3 -m unittest discover -s tests -v
      - name: Shell syntax
        run: bash -n bin/cursor-cult scripts/*.sh tests/*.sh
      - name: Packaging sync
        run: ./scripts/sync_packages.sh --check
      - name: Manifests
        run: |
          python3 -m json.tool .claude-plugin/plugin.json >/dev/null
          python3 -m json.tool .claude-plugin/marketplace.json >/dev/null
          python3 -m json.tool .codex-plugin/plugin.json >/dev/null
          python3 -m json.tool .agents/plugins/marketplace.json >/dev/null
          python3 -m json.tool plugins/cursor-cult/.claude-plugin/plugin.json >/dev/null
          python3 -m json.tool plugins/cursor-cult-codex/.codex-plugin/plugin.json >/dev/null
      - name: CLI smoke
        run: |
          ./bin/cursor-cult --version
          ./bin/cursor-cult delegate --version
