name: temporary async watchdog PR bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/agent-mode-background-warning'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract and apply async watchdog patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/async-watchdog-bootstrap.yml').read_text(encoding='utf-8')
          marker = "printf '%s' '"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("' | base64 -d | gzip -d", start)
          Path('/tmp/async-watchdog-patch.b64').write_text(workflow[start:end], encoding='utf-8')
          PY
          base64 -d /tmp/async-watchdog-patch.b64 | gzip -d > /tmp/apply_async_watchdog_patch.py
          python3 /tmp/apply_async_watchdog_patch.py
          ./scripts/sync_packages.sh
      - name: Verify patch
        shell: bash
        run: |
          python3 -m py_compile scripts/cursor_cult.py tests/test_cursor_cult.py
          python3 -m unittest discover -s tests -v
          bash -n bin/cursor-cult scripts/*.sh tests/fake_cursor_agent.sh
          ./scripts/sync_packages.sh --check
          python3 -m json.tool monitors/monitors.json >/dev/null
          python3 -m json.tool plugins/cursor-cult/monitors/monitors.json >/dev/null
      - name: Commit final patch and remove temporary bootstrap files
        shell: bash
        run: |
          rm .github/workflows/async-watchdog-bootstrap.yml
          rm .github/workflows/async-watchdog-pr-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add async watchdog event protocol"
          git push origin HEAD:${{ github.head_ref }}
