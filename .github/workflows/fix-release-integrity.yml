name: temporary release-integrity fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/agent-mode-background-warning'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Correct Claude session key and bump release version
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          roots = [
              Path('README.md'),
              Path('pyproject.toml'),
              Path('scripts'),
              Path('skills'),
              Path('codex-skills'),
              Path('plugins'),
              Path('monitors'),
              Path('.claude-plugin'),
              Path('.codex-plugin'),
              Path('.agents'),
          ]

          files = []
          for root in roots:
              if root.is_file():
                  files.append(root)
              elif root.exists():
                  files.extend(path for path in root.rglob('*') if path.is_file())

          session_updates = []
          version_updates = []
          for path in files:
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text.replace('CLAUDE_SESSION_ID', 'CLAUDE_CODE_SESSION_ID')
              if new != text:
                  session_updates.append(str(path))
              if '0.4.1' in new:
                  new = new.replace('0.4.1', '0.5.0')
                  version_updates.append(str(path))
              if new != text:
                  path.write_text(new, encoding='utf-8')

          if not session_updates:
              raise SystemExit('expected at least one CLAUDE_SESSION_ID correction')
          if not version_updates:
              raise SystemExit('expected at least one 0.4.1 release-version update')

          print('session-key updates:')
          print('\n'.join(session_updates))
          print('version updates:')
          print('\n'.join(version_updates))
          PY
          ./scripts/sync_packages.sh
          ! git grep -n 'CLAUDE_SESSION_ID'
          git grep -n 'CLAUDE_CODE_SESSION_ID'
          ! git grep -n '0.4.1'
          git grep -n '0.5.0'
      - name: Verify final tree
        shell: bash
        run: |
          python3 -m py_compile scripts/cursor_cult.py tests/test_cursor_cult.py
          python3 -m unittest discover -s tests -v
          bash -n bin/cursor-cult scripts/*.sh tests/fake_cursor_agent.sh
          ./scripts/sync_packages.sh --check
          python3 -m json.tool monitors/monitors.json >/dev/null
          python3 -m json.tool plugins/cursor-cult/monitors/monitors.json >/dev/null
          python3 -m json.tool .claude-plugin/plugin.json >/dev/null
          python3 -m json.tool .codex-plugin/plugin.json >/dev/null
      - name: Commit correction and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fix-release-integrity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correct host session key and bump v0.5.0"
          git push origin HEAD:${{ github.head_ref }}
